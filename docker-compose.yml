# RealEstateAI 本地一键编排
# 用法：
#   docker compose up --build        # 构建并启动 API（含本地 data/ 数据库与 models/ 产物）
#   docker compose up -d             # 后台运行
#   docker compose down              # 停止并移除
#
# 说明：
# - api 服务即 FastAPI 后端（端口 8000）。
# - data/ 与 models/ 通过绑定挂载，保证容器内外共享同一份数据库与训练产物，
#   避免每次重建容器丢失数据。若二者被 .gitignore 忽略且本地缺失，请先在本机
#   运行爬虫与训练（见 DEPLOY.md）后再启动。
# - 前端 React 看板请单独用 Vite 构建/启动（见 README），或部署到静态托管。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
